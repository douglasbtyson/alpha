<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="troonooz" />
    <title>troonooz</title>
    <meta name="description" content="Check whether news, sellers, and images or videos you see online can be trusted." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/" aria-label="troonooz home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="11" cy="16" r="8" />
          <circle cx="21" cy="16" r="8" />
          <path d="M17.5 16.2l2.4 2.4 4.6-5" />
        </svg>
        <span class="brand-name">troo<span>nooz</span></span>
      </a>
      <nav class="nav">
        <a href="#/" data-nav="check">Check</a>
        <a href="#/history" data-nav="history">History</a>
        <a href="#/phone" data-nav="phone">Phone</a>
      </nav>
    </header>

    <div id="banner" class="banner" hidden></div>

    <main id="view" tabindex="-1"></main>

    <footer class="footer">
      <p>
        troonooz uses AI to weigh evidence. It can be wrong &mdash; treat results as a starting point, check the cited
        sources, and use your judgment.
      </p>
      <p class="footer-meta">
        <span id="server-status">Connecting&hellip;</span>
        <button type="button" class="linklike" id="token-button" hidden>Set API token</button>
      </p>
    </footer>

    <template id="tpl-check">
      <section class="hero">
        <h1>Can you trust it?</h1>
        <p class="lede">
          Drop in a screenshot of a post, ad, or article, a photo, or a video. troonooz checks the claims, the seller,
          and whether the media is real.
        </p>
      </section>

      <form id="check-form" class="card check-form" novalidate>
        <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-describedby="drop-help">
          <svg viewBox="0 0 24 24" class="drop-icon" aria-hidden="true">
            <path d="M12 16V4m0 0l-4.5 4.5M12 4l4.5 4.5M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3" />
          </svg>
          <p class="drop-title">Drop screenshots, images, or videos</p>
          <p id="drop-help" class="drop-help">
            or <span class="linklike">browse</span> &middot; paste a screenshot with <kbd>Ctrl</kbd>/<kbd>&#8984;</kbd>+<kbd>V</kbd>
          </p>
          <input id="file-input" type="file" accept="image/*,video/*" multiple hidden />
        </div>
        <ul id="attachments" class="attachments" aria-live="polite"></ul>

        <label class="field">
          <span class="field-label">Text or context <span class="optional">optional</span></span>
          <textarea id="text-input" rows="4" placeholder="Paste the post text, a message you received, or describe where you saw it"></textarea>
        </label>

        <label class="field">
          <span class="field-label">Links to check <span class="optional">optional</span></span>
          <textarea id="urls-input" rows="2" placeholder="https://&hellip; (one per line): an article, a store, a post"></textarea>
        </label>

        <fieldset class="field">
          <legend class="field-label">What should we check?</legend>
          <div class="chips" role="group">
            <label class="chip"><input type="checkbox" name="focus" value="auto" checked /><span>Everything relevant</span></label>
            <label class="chip"><input type="checkbox" name="focus" value="news" /><span>News &amp; claims</span></label>
            <label class="chip"><input type="checkbox" name="focus" value="vendor" /><span>Seller or ad</span></label>
            <label class="chip"><input type="checkbox" name="focus" value="media" /><span>Image &amp; video</span></label>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend class="field-label">How thorough?</legend>
          <div class="segmented" role="radiogroup">
            <label>
              <input type="radio" name="mode" value="thorough" checked />
              <span><strong>Thorough</strong><small>Verifies the key claims with several searches</small></span>
            </label>
            <label>
              <input type="radio" name="mode" value="quick" />
              <span><strong>Quick</strong><small>Faster and cheaper: a lighter model, a few searches, a shorter report</small></span>
            </label>
          </div>
        </fieldset>

        <label class="switch">
          <input type="checkbox" id="web-input" checked />
          <span class="switch-track" aria-hidden="true"></span>
          <span>Verify with live web search</span>
        </label>

        <p id="form-error" class="form-error" role="alert" hidden></p>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submit-button">Check it</button>
          <span class="form-hint" id="mode-hint">Thorough checks usually take 1&ndash;2 minutes.</span>
        </div>
      </form>

      <section class="how">
        <div class="how-item">
          <h3>News &amp; claims</h3>
          <p>Finds the checkable claims, searches for independent corroboration, and flags recycled stories, impersonated sources, and manipulation tactics.</p>
        </div>
        <div class="how-item">
          <h3>Sellers &amp; ads</h3>
          <p>Looks up reviews, complaints, and domain age, and spots scam patterns like fake discounts, urgency, and risky payment methods.</p>
        </div>
        <div class="how-item">
          <h3>Images &amp; video</h3>
          <p>Zooms into details for signs of AI generation or editing, reads embedded provenance metadata, and searches for the original context.</p>
        </div>
      </section>
    </template>

    <template id="tpl-report">
      <section id="progress" class="card progress" hidden>
        <div class="progress-head">
          <div class="spinner" aria-hidden="true"></div>
          <div>
            <h2 id="progress-title">Checking&hellip;</h2>
            <p class="muted"><span id="progress-elapsed">0s</span> elapsed</p>
          </div>
        </div>
        <ol id="progress-steps" class="steps" aria-live="polite"></ol>
        <div id="draft" class="draft" aria-live="polite" hidden></div>
      </section>
      <section id="match" class="card match-card" hidden></section>
      <section id="report-error" class="card error-card" role="alert" hidden></section>
      <article id="report" class="report" hidden></article>
    </template>

    <template id="tpl-phone">
      <section class="history-head">
        <h1>Scan your iPhone screen</h1>
        <p class="muted">Double-tap the back of your iPhone in any app (social media, Safari, messages, anything) to check what's on screen and see what's going on.</p>
      </section>
      <div id="phone-warning" class="card error-card" hidden>
        <h2>Open this page on your iPhone</h2>
        <p>This page is open at <code id="phone-origin-warn"></code>, an address only this computer can use. Set up Tailscale (step 1), then open this page on your iPhone using your Tailscale address. The steps below will then show the exact settings to use.</p>
      </div>
      <ol class="setup">
        <li class="card setup-step">
          <h2>1. Connect your iPhone to troonooz</h2>
          <p>Install <strong>Tailscale</strong> on this computer and on your iPhone (App Store), and sign in to the same account on both. Then, on this computer, run this once in PowerShell:</p>
          <div class="copy-row"><code id="serve-cmd">tailscale serve --bg 8787</code><button type="button" class="btn btn-small" data-copy="serve-cmd">Copy</button></div>
          <p>It shares troonooz with your own Tailscale devices only (not the public internet), keeps sharing after reboots, and shows an <code>https://….ts.net</code> address. Open that address in Safari on your iPhone. Your iPhone reaches troonooz from anywhere while this computer is on and troonooz is running.</p>
          <p>Address of this page: <code id="phone-origin"></code></p>
          <p id="base-mismatch" class="form-error" hidden></p>
        </li>
        <li class="card setup-step">
          <h2>2. Create the shortcut</h2>
          <p>On your iPhone, open the <strong>Shortcuts</strong> app, tap <strong>+</strong>, name it <strong>Check with troonooz</strong>, and add these four actions in order:</p>
          <ol class="actions-list">
            <li><strong>Take Screenshot</strong></li>
            <li>
              <strong>Get Contents of URL</strong>. Set the URL to:
              <div class="copy-row"><code id="scan-url"></code><button type="button" class="btn btn-small" data-copy="scan-url">Copy</button></div>
              Tap the arrow to show more options: <strong>Method</strong> = POST, <strong>Request Body</strong> = File, and choose <em>Screenshot</em> as the file.
              <span id="token-step" hidden>Under <strong>Headers</strong>, add <strong>Authorization</strong> with the value <code>Bearer</code> followed by a space and your troonooz API token.</span>
            </li>
            <li><strong>Get Dictionary Value</strong>: get <em>Value</em> for key <code>open_url</code> in <em>Contents of URL</em>.</li>
            <li><strong>Open URLs</strong> (it opens the <em>Dictionary Value</em>).</li>
          </ol>
          <p class="muted">The scan uses a quick check. For a thorough check, use this URL instead:</p>
          <div class="copy-row"><code id="scan-url-thorough"></code><button type="button" class="btn btn-small" data-copy="scan-url-thorough">Copy</button></div>
        </li>
        <li class="card setup-step">
          <h2>3. Make it one tap</h2>
          <p><strong>Back Tap:</strong> Settings &rarr; Accessibility &rarr; Touch &rarr; Back Tap &rarr; Double Tap &rarr; <em>Check with troonooz</em>. Then double-tap the back of your iPhone in any app.</p>
          <p><strong>Action Button</strong> (iPhone 15 Pro and later): Settings &rarr; Action Button &rarr; Shortcut &rarr; <em>Check with troonooz</em>.</p>
        </li>
        <li class="card setup-step">
          <h2>4. Put troonooz on your Home Screen (optional)</h2>
          <p>In Safari on your iPhone, open troonooz at the address above, tap <strong>Share</strong> &rarr; <strong>Add to Home Screen</strong>. Use it to see your history and run checks from photos you've saved.</p>
        </li>
      </ol>
    </template>

    <template id="tpl-history">
      <section class="history-head">
        <h1>History</h1>
        <p class="muted">Checks run on this server, newest first.</p>
      </section>
      <ul id="history-list" class="history-list"></ul>
    </template>
  </body>
</html>
